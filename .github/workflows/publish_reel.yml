name: 인스타 릴스 발행

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "check=최근 게시물만 조회 / publish=발행 / refresh=토큰갱신"
        type: choice
        options: [check, publish, refresh]
        default: check
      video:
        description: "영상 파일명 (예: info_reel_09.mp4)"
        default: ""
      cover:
        description: "커버 파일명 (예: cover_info_09.jpg)"
        default: ""
      caption:
        description: "캡션 파일명 (예: caption_info_09.txt)"
        default: ""
      force:
        description: "중복 점검을 무시하고 강제 발행"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 1 * *"      # 매월 1일 — 60일 토큰 자동 갱신

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet requests pynacl
      - name: 실행
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          MODE: ${{ github.event_name == 'schedule' && 'refresh' || inputs.mode }}
          VIDEO: ${{ inputs.video }}
          COVER: ${{ inputs.cover }}
          CAPTION: ${{ inputs.caption }}
          FORCE: ${{ inputs.force }}
        run: python publish_reel.py
